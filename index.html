<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <!-- Cache-busted Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#121316" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Argus" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>Argus CRM</title>

    <!-- Immediate Service Worker Registration (Fixes the Chrome Badge!) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/OneSignalSDKWorker.js');
        });
      }
    </script>

    <!-- OneSignal Push Notifications SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "e07ab1fb-c308-4bc7-9555-6172a01ac793",
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
